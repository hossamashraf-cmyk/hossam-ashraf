backend:
  name: github
  repo: hossamashraf-cmyk/hossam-ashraf
  branch: main
media_folder: "images"
public_folder: "images"
locale: "ar"
collections:
  - name: "database"
    label: "إدارة محتوى الموقع"
    files:
      - label: "قاعدة البيانات الشاملة"
        name: "data"
        file: "data.json"
        fields:
          - name: projects
            label: "الفيديوهات والمشاريع (Portfolio)"
            widget: list
            fields:
              - {label: "الـ ID (حروف إنجليزية فقط)", name: "id", widget: "string"}
              - {label: "المصدر", name: "type", widget: "select", options: ["youtube", "drive", "link"]}
              - {label: "يوتيوب ID (لو موجود)", name: "ytId", widget: "string", required: false}
              - {label: "جوجل درايف ID (لو موجود)", name: "driveId", widget: "string", required: false}
              - {label: "القسم", name: "category", widget: "select", options: ["reels", "videos", "ai", "history"]}
              - {label: "الأبعاد", name: "orientation", widget: "select", options: ["vertical", "wide"]}
              - name: "title"
                label: "العنوان"
                widget: "object"
                fields:
                  - {label: "عربي", name: "ar", widget: "string"}
                  - {label: "إنجليزي", name: "en", widget: "string"}
              - name: "role"
                label: "الوصف / الدور"
                widget: "object"
                fields:
                  - {label: "عربي", name: "ar", widget: "string"}
                  - {label: "إنجليزي", name: "en", widget: "string"}
          - name: testimonials
            label: "آراء العملاء"
            widget: list
            fields:
              - name: "name"
                label: "الاسم"
                widget: "object"
                fields:
                  - {label: "عربي", name: "ar", "widget": "string"}
                  - {label: "إنجليزي", name: "en", "widget": "string"}
              - name: "role"
                label: "الوظيفة"
                widget: "object"
                fields:
                  - {label: "عربي", name: "ar", "widget": "string"}
                  - {label: "إنجليزي", name: "en", "widget": "string"}
              - name: "text"
                label: "الرأي"
                widget: "object"
                fields:
                  - {label: "عربي", name: "ar", "widget": "text"}
                  - {label: "إنجليزي", name: "en", "widget": "text"}
          - name: results
            label: "أرقام المشاهدات"
            widget: list
            fields:
              - {label: "مسار الصورة (مثال: images/views/pic.png)", name: "img", widget: "string"}
              - {label: "المشاهدات (مثال: 166K)", name: "views", widget: "string"}
              - {label: "المجال", name: "industry", widget: "select", options: ["restaurants", "fashion", "furniture", "factories", "stores", "beauty", "cosmetics", "clinics", "ai"]}
